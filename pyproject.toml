[project]
name = "urban-mobility-risk-analysis"
version = "0.1.0"
description = "Analysis of traffic accidents in Frankfurt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contextily",
    "geopandas",
    "ipykernel",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow>=25.0.1",
    "scikit-learn",
    "seaborn",
]

[dependency-groups]
# Needs system libraries (macOS: brew install cairo pango pkg-config)
manim = ["manim"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "urban_mobility"
